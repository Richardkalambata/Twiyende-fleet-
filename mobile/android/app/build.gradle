plugins {
    id "com.android.application"
}

android {
    namespace "com.modernmindsettechnologies.twende"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.modernmindsettechnologies.twende"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "0.1.2"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "audience"
    productFlavors {
        rider {
            dimension "audience"
            buildConfigField "boolean", "FLEET", "false"
            resValue "string", "app_name", "Twende"
        }
        fleet {
            dimension "audience"
            applicationIdSuffix ".fleet"
            buildConfigField "boolean", "FLEET", "true"
            resValue "string", "app_name", "Twende Fleet"
            versionCode 1
            versionName "0.1.0"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.core:core:1.16.0"
    implementation "androidx.webkit:webkit:1.14.0"
    implementation("com.journeyapps:zxing-android-embedded:4.3.0") {
        exclude group: "com.google.zxing", module: "core"
    }
    implementation "com.google.zxing:core:3.5.4"
    testImplementation "junit:junit:4.13.2"
}
